[project]
name = "pac-man"
version = "0.1.0"
description = "A configurable multi-level Pac-Man maze game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.8",
    "mazegenerator",
]

[tool.uv.sources]
mazegenerator = { path = "packagies/mazegenerator-2.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pyinstaller>=6.22.3",
]

[[tool.mypy.overrides]]
module = ["mazegenerator", "mazegenerator.*"]
follow_untyped_imports = true
